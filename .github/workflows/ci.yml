name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # コンパイル、Spotless、単体・アーキテクチャテスト（Surefire）、結合テスト（Failsafe + Testcontainers）
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    # 1 コマンド起動（N-7）が壊れていないことを確かめる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait
      - name: API に画面と同じオリジンから届く
        run: curl --fail --silent --show-error http://localhost:8080/api/actuator/health | grep '"status":"UP"'
      - name: SPA のルーティング
        run: curl --fail --silent --show-error http://localhost:8080/t/example/agent | grep '<div id="app">'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
