name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # コンパイル、Spotless、単体・アーキテクチャテスト（Surefire）、結合テスト（Failsafe + Testcontainers）
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API の型が openapi.json から生成し直されている
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    # 1 コマンド起動（N-7）が壊れていないことを確かめる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait
      - name: API に画面と同じオリジンから届く
        run: curl --fail --silent --show-error http://localhost:8080/api/actuator/health | grep '"status":"UP"'
      - name: デモアカウントでログインできる（F-D-1）
        run: |
          curl --fail --silent --cookie-jar jar --cookie jar http://localhost:8080/api/csrf
          token=$(awk '/XSRF-TOKEN/ {print $7}' jar)
          curl --fail --silent --show-error --cookie-jar jar --cookie jar \
            -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"admin@support.example.com","password":"demo-password"}' \
            http://localhost:8080/api/t/demo-support/session
          curl --fail --silent --show-error --cookie jar 'http://localhost:8080/api/t/demo-support/tickets?size=1' | grep '"total":10'
      - name: SPA のルーティング
        run: curl --fail --silent --show-error http://localhost:8080/t/example/agent | grep '<div id="app">'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
